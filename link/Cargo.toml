[package]
name = "elesdee-link"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Shared protocol types for the elesdee phone link"

[lib]
name = "elesdee_link"
path = "src/lib.rs"

[dependencies]
blake3 = "=1.8.7"
iroh = "=1.5.0"
iroh-mdns-address-lookup = { version = "=0.6.1", optional = true }
iroh-tickets = "=1.0.0"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "=2.6.1"
zeroize = "=1.9.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
mdns = ["dep:iroh-mdns-address-lookup"]

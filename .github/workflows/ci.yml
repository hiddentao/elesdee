name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            link
      - name: Install UI dependencies
        run: npm ci
      - name: UI types and tests
        run: npm run check:ui
      - name: UI build
        run: npm run build
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Core tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Link format
        run: cargo fmt --manifest-path link/Cargo.toml --check
      - name: Link clippy
        run: cargo clippy --manifest-path link/Cargo.toml --all-targets -- -D warnings
      - name: Link tests
        run: cargo test --manifest-path link/Cargo.toml
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e

  phone-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phone-shell/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: phone-shell/src-tauri
      - name: Install shell dependencies
        run: npm ci --prefix phone-shell
      - name: Shell catalogs and types
        run: |
          npm --prefix phone-shell run test
          npm --prefix phone-shell run typecheck
      - name: Build shell UI
        run: npm --prefix phone-shell run build
      - name: Shell format
        run: cargo fmt --manifest-path phone-shell/src-tauri/Cargo.toml --check
      - name: Shell clippy
        run: cargo clippy --manifest-path phone-shell/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Shell tests
        run: cargo test --manifest-path phone-shell/src-tauri/Cargo.toml

  desktop-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install UI dependencies
        run: npm ci
      - name: Build UI for the shell
        run: npm run build
      - name: Check the desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

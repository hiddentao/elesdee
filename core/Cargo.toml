[package]
name = "elesdee-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "elesdee_core"
path = "src/lib.rs"

[[bin]]
name = "elesdee-core"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

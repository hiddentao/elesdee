[package]
name = "elesdee-phone"
version = "0.1.0"
description = "elesdee phone shell"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "elesdee_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
elesdee-link = { path = "../../link" }
keyring-core = "=1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-barcode-scanner = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
